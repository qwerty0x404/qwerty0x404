
<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f9b53"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#122016" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="898" height="498" rx="14" fill="#0a0f0c" stroke="#173321" stroke-width="1.5"/>
  <rect x="14" y="14" width="872" height="472" rx="8" fill="url(#grid)" opacity="0.5"/>

  <!-- scanline sweep -->
  <rect x="14" y="14" width="872" height="2" fill="#39ff14" opacity="0.18">
    <animate attributeName="y" values="14;478;14" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- header -->
  <text x="34" y="42" font-family="Consolas, 'Fira Code', monospace" font-size="13" fill="#5fa579">root@qwerty:~$ cat skill_matrix.log</text>
  <text x="34" y="66" font-family="Consolas, 'Fira Code', monospace" font-size="20" fill="#39ff14" font-weight="bold">SKILL MATRIX</text>
  <text x="866" y="42" font-family="Consolas, monospace" font-size="11" fill="#3f6b4d" text-anchor="end">SYS_ID: 0x2F91</text>
  <text x="866" y="58" font-family="Consolas, monospace" font-size="11" fill="#39ff14" text-anchor="end">
    STATUS: ONLINE
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <line x1="34" y1="80" x2="866" y2="80" stroke="#173321" stroke-width="1"/>

  <!-- rows -->
  <!-- row template: label y offset, value -->

  <!-- WEB SECURITY 90 -->
  <g transform="translate(34,108)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#d7f5df">WEB SECURITY</text>
    <text x="832" y="0" font-family="Consolas, monospace" font-size="14" fill="#39ff14" text-anchor="end">90%</text>
    <rect x="0" y="12" width="832" height="10" rx="5" fill="#0f1611" stroke="#1c3a26" stroke-width="1"/>
    <clipPath id="clip1"><rect x="0" y="12" width="748.8" height="10" rx="5"/></clipPath>
    <rect x="0" y="12" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="748.8" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <g clip-path="url(#clip1)">
      <rect x="-140" y="12" width="60" height="10" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="-140" to="832" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- NETWORK SECURITY 88 -->
  <g transform="translate(34,148)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#d7f5df">NETWORK SECURITY</text>
    <text x="832" y="0" font-family="Consolas, monospace" font-size="14" fill="#39ff14" text-anchor="end">88%</text>
    <rect x="0" y="12" width="832" height="10" rx="5" fill="#0f1611" stroke="#1c3a26" stroke-width="1"/>
    <clipPath id="clip2"><rect x="0" y="12" width="732.2" height="10" rx="5"/></clipPath>
    <rect x="0" y="12" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="732.2" dur="1.6s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <g clip-path="url(#clip2)">
      <rect x="-140" y="12" width="60" height="10" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="-140" to="832" dur="2.8s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- PYTHON 88 -->
  <g transform="translate(34,188)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#d7f5df">PYTHON</text>
    <text x="832" y="0" font-family="Consolas, monospace" font-size="14" fill="#39ff14" text-anchor="end">88%</text>
    <rect x="0" y="12" width="832" height="10" rx="5" fill="#0f1611" stroke="#1c3a26" stroke-width="1"/>
    <clipPath id="clip3"><rect x="0" y="12" width="732.2" height="10" rx="5"/></clipPath>
    <rect x="0" y="12" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="732.2" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <g clip-path="url(#clip3)">
      <rect x="-140" y="12" width="60" height="10" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="-140" to="832" dur="2.8s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- LINUX 85 -->
  <g transform="translate(34,228)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#d7f5df">LINUX</text>
    <text x="832" y="0" font-family="Consolas, monospace" font-size="14" fill="#39ff14" text-anchor="end">85%</text>
    <rect x="0" y="12" width="832" height="10" rx="5" fill="#0f1611" stroke="#1c3a26" stroke-width="1"/>
    <clipPath id="clip4"><rect x="0" y="12" width="707.2" height="10" rx="5"/></clipPath>
    <rect x="0" y="12" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="707.2" dur="1.6s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <g clip-path="url(#clip4)">
      <rect x="-140" y="12" width="60" height="10" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="-140" to="832" dur="2.8s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- AI / MACHINE LEARNING 82 -->
  <g transform="translate(34,268)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#d7f5df">AI / MACHINE LEARNING</text>
    <text x="832" y="0" font-family="Consolas, monospace" font-size="14" fill="#39ff14" text-anchor="end">82%</text>
    <rect x="0" y="12" width="832" height="10" rx="5" fill="#0f1611" stroke="#1c3a26" stroke-width="1"/>
    <clipPath id="clip5"><rect x="0" y="12" width="682.2" height="10" rx="5"/></clipPath>
    <rect x="0" y="12" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="682.2" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <g clip-path="url(#clip5)">
      <rect x="-140" y="12" width="60" height="10" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="-140" to="832" dur="2.8s" begin="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- AUTOMATION 85 -->
  <g transform="translate(34,308)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#d7f5df">AUTOMATION</text>
    <text x="832" y="0" font-family="Consolas, monospace" font-size="14" fill="#39ff14" text-anchor="end">85%</text>
    <rect x="0" y="12" width="832" height="10" rx="5" fill="#0f1611" stroke="#1c3a26" stroke-width="1"/>
    <clipPath id="clip6"><rect x="0" y="12" width="707.2" height="10" rx="5"/></clipPath>
    <rect x="0" y="12" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="707.2" dur="1.6s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <g clip-path="url(#clip6)">
      <rect x="-140" y="12" width="60" height="10" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="-140" to="832" dur="2.8s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <line x1="34" y1="358" x2="866" y2="358" stroke="#173321" stroke-width="1"/>
  <text x="34" y="382" font-family="Consolas, monospace" font-size="11" fill="#3f6b4d">// values reflect applied experience, not certification count</text>
  <text x="34" y="402" font-family="Consolas, monospace" font-size="11" fill="#3f6b4d">// last_indexed: build-time static snapshot</text>

  <rect x="34" y="424" width="8" height="8" fill="#39ff14">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="432" font-family="Consolas, monospace" font-size="11" fill="#5fa579">END OF LOG</text>
</svg>
