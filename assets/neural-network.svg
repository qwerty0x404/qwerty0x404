<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="nnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="nnGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#101d13" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="418" rx="14" fill="#0a0f0c" stroke="#173321" stroke-width="1.5"/>
  <rect x="14" y="14" width="872" height="392" rx="8" fill="url(#nnGrid)" opacity="0.5"/>

  <text x="34" y="42" font-family="Consolas, monospace" font-size="13" fill="#5fa579">root@qwerty:~$ python3 pipeline.py --trace</text>
  <text x="34" y="66" font-family="Consolas, monospace" font-size="20" fill="#39ff14" font-weight="bold">AI / NEURAL PIPELINE</text>
  <line x1="34" y1="80" x2="866" y2="80" stroke="#173321" stroke-width="1"/>

  <!-- 5 columns: DATA, MODEL, INFERENCE, AGENT, AUTOMATION, x positions -->
  <!-- column x centers -->
  <g font-family="Consolas, monospace" font-size="12" fill="#d7f5df" text-anchor="middle">
    <text x="118" y="360">DATA</text>
    <text x="298" y="360">MODEL</text>
    <text x="478" y="360">INFERENCE</text>
    <text x="658" y="360">AGENT</text>
    <text x="838" y="360" text-anchor="end">AUTOMATION</text>
  </g>

  <!-- connecting lines between adjacent columns (partial mesh) -->
  <g stroke="#1c3a26" stroke-width="1">
    <line x1="118" y1="120" x2="298" y2="110"/>
    <line x1="118" y1="120" x2="298" y2="170"/>
    <line x1="118" y1="180" x2="298" y2="110"/>
    <line x1="118" y1="180" x2="298" y2="170"/>
    <line x1="118" y1="180" x2="298" y2="230"/>
    <line x1="118" y1="240" x2="298" y2="170"/>
    <line x1="118" y1="240" x2="298" y2="230"/>

    <line x1="298" y1="110" x2="478" y2="140"/>
    <line x1="298" y1="170" x2="478" y2="140"/>
    <line x1="298" y1="170" x2="478" y2="200"/>
    <line x1="298" y1="230" x2="478" y2="200"/>
    <line x1="298" y1="230" x2="478" y2="260"/>

    <line x1="478" y1="140" x2="658" y2="160"/>
    <line x1="478" y1="200" x2="658" y2="160"/>
    <line x1="478" y1="200" x2="658" y2="230"/>
    <line x1="478" y1="260" x2="658" y2="230"/>

    <line x1="658" y1="160" x2="838" y2="190"/>
    <line x1="658" y1="230" x2="838" y2="190"/>
  </g>

  <!-- flowing pulse along the main spine -->
  <circle r="4" fill="#39ff14" filter="url(#nnGlow)">
    <animateMotion path="M118,180 L298,170 L478,200 L658,230 L838,190" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- DATA nodes -->
  <g fill="#0a1a10" stroke="#2fb567" stroke-width="1.4">
    <circle cx="118" cy="120" r="9"><animate attributeName="r" values="9;11;9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="180" r="9"><animate attributeName="r" values="9;11;9" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="240" r="9"><animate attributeName="r" values="9;11;9" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- MODEL nodes -->
  <g fill="#0a1a10" stroke="#2fb567" stroke-width="1.4">
    <circle cx="298" cy="110" r="9"><animate attributeName="r" values="9;11;9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="298" cy="170" r="9"><animate attributeName="r" values="9;11;9" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="298" cy="230" r="9"><animate attributeName="r" values="9;11;9" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- INFERENCE nodes -->
  <g fill="#0a1a10" stroke="#39ff14" stroke-width="1.6">
    <circle cx="478" cy="140" r="9"><animate attributeName="r" values="9;12;9" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="478" cy="200" r="9"><animate attributeName="r" values="9;12;9" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="478" cy="260" r="9"><animate attributeName="r" values="9;12;9" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <!-- AGENT nodes -->
  <g fill="#0a1a10" stroke="#2fb567" stroke-width="1.4">
    <circle cx="658" cy="160" r="9"><animate attributeName="r" values="9;11;9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="658" cy="230" r="9"><animate attributeName="r" values="9;11;9" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- AUTOMATION node -->
  <g fill="#0a1a10" stroke="#39ff14" stroke-width="1.8" filter="url(#nnGlow)">
    <circle cx="838" cy="190" r="11"><animate attributeName="r" values="11;14;11" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <text x="34" y="392" font-family="Consolas, monospace" font-size="11" fill="#3f6b4d">// data -&gt; model -&gt; inference -&gt; agent -&gt; automation, closed loop with human oversight</text>
</svg>
