<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="ngGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ngGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#101d13" stroke-width="1"/>
    </pattern>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123522"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="438" rx="14" fill="#0a0f0c" stroke="#173321" stroke-width="1.5"/>
  <rect x="14" y="14" width="872" height="412" rx="8" fill="url(#ngGrid)" opacity="0.5"/>

  <text x="34" y="42" font-family="Consolas, monospace" font-size="13" fill="#5fa579">root@qwerty:~$ traceroute --layered</text>
  <text x="34" y="66" font-family="Consolas, monospace" font-size="20" fill="#39ff14" font-weight="bold">NETWORK / INFRASTRUCTURE FLOW</text>
  <line x1="34" y1="80" x2="866" y2="80" stroke="#173321" stroke-width="1"/>

  <!-- central vertical chain -->
  <!-- nodes at x=340 width 220, y positions -->
  <!-- CLIENT 108 / NETWORK 158 / PROTOCOL 208 / SERVICE 258 / APPLICATION 308 / SECURITY LAYER 358 -->

  <g font-family="Consolas, monospace" font-size="13" fill="#d7f5df" text-anchor="middle">
    <!-- connecting line with animated dash flow -->
    <line x1="450" y1="122" x2="450" y2="378" stroke="#1c3a26" stroke-width="3"/>
    <line x1="450" y1="122" x2="450" y2="378" stroke="#39ff14" stroke-width="2" stroke-dasharray="6 10" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.6s" repeatCount="indefinite"/>
    </line>

    <!-- traveling packet -->
    <circle r="4" fill="#39ff14" filter="url(#ngGlow)">
      <animateMotion path="M450,122 L450,378" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(340,100)">
      <rect width="220" height="36" rx="6" fill="url(#nodeFill)" stroke="#39ff14" stroke-width="1.2"/>
      <text x="110" y="23">CLIENT</text>
    </g>
    <g transform="translate(340,150)">
      <rect width="220" height="36" rx="6" fill="url(#nodeFill)" stroke="#2fb567" stroke-width="1.2"/>
      <text x="110" y="23">NETWORK</text>
    </g>
    <g transform="translate(340,200)">
      <rect width="220" height="36" rx="6" fill="url(#nodeFill)" stroke="#2fb567" stroke-width="1.2"/>
      <text x="110" y="23">PROTOCOL</text>
    </g>
    <g transform="translate(340,250)">
      <rect width="220" height="36" rx="6" fill="url(#nodeFill)" stroke="#2fb567" stroke-width="1.2"/>
      <text x="110" y="23">SERVICE</text>
    </g>
    <g transform="translate(340,300)">
      <rect width="220" height="36" rx="6" fill="url(#nodeFill)" stroke="#2fb567" stroke-width="1.2"/>
      <text x="110" y="23">APPLICATION</text>
    </g>
    <g transform="translate(340,350)">
      <rect width="220" height="36" rx="6" fill="url(#nodeFill)" stroke="#39ff14" stroke-width="1.6" filter="url(#ngGlow)"/>
      <text x="110" y="23" fill="#39ff14">SECURITY LAYER</text>
    </g>
  </g>

  <!-- peripheral nodes with thin links, representing distributed hosts -->
  <g stroke="#1c3a26" stroke-width="1">
    <line x1="120" y1="168" x2="340" y2="168"/>
    <line x1="120" y1="228" x2="340" y2="218"/>
    <line x1="780" y1="188" x2="560" y2="168"/>
    <line x1="780" y1="268" x2="560" y2="268"/>
    <line x1="120" y1="330" x2="340" y2="318"/>
    <line x1="780" y1="350" x2="560" y2="368"/>
  </g>
  <g fill="#0a1a10" stroke="#2fb567" stroke-width="1.2">
    <circle cx="120" cy="168" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="228" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="330" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="188" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="268" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="350" r="7"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <text x="34" y="410" font-family="Consolas, monospace" font-size="11" fill="#3f6b4d">// packets traverse layered inspection before reaching application scope</text>
</svg>
